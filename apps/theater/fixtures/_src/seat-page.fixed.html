<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Encore · Pick a seat</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.45 system-ui, sans-serif; background: #07070c; color: #f4f2ff; height: 100vh; display: grid; grid-template-columns: 520px 1fr; }
  .poster { position: relative; overflow: hidden; padding: 48px; display: flex; flex-direction: column; justify-content: flex-end;
    background: radial-gradient(120% 80% at 20% 10%, #ff4fd8 0%, transparent 55%), radial-gradient(90% 70% at 90% 60%, #3b5bff 0%, transparent 60%), linear-gradient(160deg, #2a0b4a, #07070c 75%); }
  .poster::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 4px); }
  .brand { position: absolute; top: 40px; left: 48px; font-weight: 800; letter-spacing: .3em; font-size: 13px; }
  .poster h1 { font-size: 64px; line-height: .95; letter-spacing: -.03em; font-weight: 900; }
  .poster p { margin-top: 14px; color: #e5dcff; font-size: 17px; }
  main { padding: 56px 64px; display: flex; flex-direction: column; gap: 28px; }
  .eyebrow { color: #a79bd6; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
  h2 { font-size: 30px; letter-spacing: -.02em; margin-top: 6px; }
  .stage { height: 46px; border-radius: 0 0 200px 200px / 0 0 46px 46px; background: linear-gradient(#3a2d6b, #181332); display: grid; place-items: center; color: #cfc4ff; font-size: 12px; letter-spacing: .3em; }
  .row { display: flex; gap: 14px; align-items: center; justify-content: center; }
  .row-label { width: 70px; color: #8f86b3; font-size: 13px; }
  .seat { font: inherit; color: inherit; width: 72px; height: 72px; border-radius: 16px 16px 10px 10px; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #f4f2ff; background: #1c1836; border: 1px solid #3a3364; cursor: pointer; transition: .15s; }
  .seat:hover { background: #2b2552; }
  .seat.taken { background: #121020; color: #4b4670; cursor: not-allowed; border-style: dashed; }
  .seat.sel { background: linear-gradient(160deg, #ff4fd8, #7b5cff); border-color: transparent; color: #fff; box-shadow: 0 10px 30px rgba(255,79,216,.35); }
  .seat:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .legend { display: flex; gap: 24px; justify-content: center; color: #8f86b3; font-size: 13px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 8px; vertical-align: -1px; background: #1c1836; border: 1px solid #3a3364; }
  .legend .s { background: #ff4fd8; border: 0; } .legend .t { background: #121020; border-style: dashed; }
  .bar { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-radius: 18px; background: #12101f; border: 1px solid #2a2547; }
  #status { color: #cfc4ff; font-size: 16px; }
  #book { font: inherit; font-weight: 700; font-size: 16px; padding: 14px 28px; border-radius: 12px; border: 0; color: #0b0618; background: #f4f2ff; cursor: pointer; }
  #book:disabled { opacity: .35; cursor: not-allowed; }
  #done { font-size: 22px; font-weight: 800; color: #7dffb2; min-height: 30px; }
</style>
</head>
<body>
  <section class="poster">
    <div class="brand">ENCORE</div>
    <h1>AURORA<br>VALE</h1>
    <p>Neon Tides Tour · The Fillmore, San Francisco<br>Friday 21 Nov · Doors 7:30 PM</p>
  </section>
  <main>
    <div><div class="eyebrow">Step 3 of 4</div><h2>Pick a seat</h2></div>
    <div class="stage">STAGE</div>
    <div id="map" class="row" role="group" aria-label="Row 14 seats"><span class="row-label">Row 14</span></div>
    <div class="legend"><span><i></i>Available</span><span><i class="s"></i>Selected</span><span><i class="t"></i>Taken</span></div>
    <p id="done" role="status"></p>
    <div class="bar"><span id="status">No seat selected</span><button id="book" disabled>Book seat</button></div>
  </main>
<script>
const seats = [['14A', true], ['14B', false], ['14C', false], ['14D', true], ['14E', true], ['14F', true]];
const map = document.getElementById('map');
const book = document.getElementById('book');
let selected = null;

function selectSeat(el, id) {
  map.querySelectorAll('.seat').forEach((s) => { s.classList.remove('sel'); s.setAttribute('aria-pressed', 'false'); });
  el.classList.add('sel');
  el.setAttribute('aria-pressed', 'true');
  selected = id;
  document.getElementById('status').textContent = 'Selected ' + id;
  book.disabled = false;
  book.textContent = 'Book seat ' + id;
}

function renderSeat(id, taken) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'seat' + (taken ? ' taken' : '');
  el.textContent = id.slice(2);
  el.dataset.seat = id;
  el.setAttribute('aria-label', `Seat ${id}, ${taken ? 'taken' : 'available'}`);
  el.setAttribute('aria-pressed', 'false');
  el.disabled = taken;
  if (!taken) el.addEventListener('click', () => selectSeat(el, id));
  return el;
}

seats.forEach(([id, taken]) => map.appendChild(renderSeat(id, taken)));
book.addEventListener('click', () => { document.getElementById('done').textContent = 'Booked ' + selected; });
</script>
</body>
</html>
