name: Mobile — Kane CLI on a mobile target

# Runs Encore (the demo booking app) as a native app on a real mobile target in
# CI, driven by kane-cli --target on a macOS Apple-Silicon runner — the only
# GitHub-hosted runner kane-cli supports for --target emulator/simulator. The
# same planted accessibility barriers ship inside the app, so a "blind"
# (accessibility-only) objective exercises them like a VoiceOver/Switch user.
#
#   simulator → Encore as an unsigned WKWebView-shell .app on an iOS simulator
#               (runs as a native process — the reliable target on GHA runners)
#   emulator  → Encore as a Capacitor WebView-shell .apk on an Android emulator
#               (requires HVF hardware accel; GitHub arm64 runners refuse it —
#               qemu exits "HVF error: HV_UNSUPPORTED". Kept for self-hosted or
#               local macOS runners where acceleration exists.)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Mobile target for the Kane runs
        required: true
        default: simulator
        type: choice
        options: [simulator, emulator]
      lanes:
        description: Which Kane objectives to run
        required: true
        default: both
        type: choice
        options: [both, sighted, blind]
      device_name:
        description: Device name for the run ("auto" picks the first discovered; for simulator an iPhone is preferred)
        required: true
        default: auto
      os_version:
        description: Device OS version for the run ("auto" picks the discovered version)
        required: true
        default: auto
      avd_name:
        description: "(emulator) AVD to create — no spaces"
        required: true
        default: Pixel_8_Pro
      device_profile:
        description: "(emulator) avdmanager -d hardware profile"
        required: true
        default: pixel_8_pro
      system_image:
        description: "(emulator) sdkmanager system image for the AVD"
        required: true
        default: system-images;android-35;google_apis;arm64-v8a
      setup_only:
        description: Stop after toolchain probe — no Kane runs (0 credits)
        required: false
        type: boolean
        default: false

concurrency:
  group: mobile-ci
  cancel-in-progress: false

env:
  KANE_VERSION: "0.10.6"
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
  TARGET: ${{ github.event.inputs.target }}

jobs:
  mobile:
    runs-on: macos-15 # arm64 Apple Silicon — required for --target emulator|simulator
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (simctl needs full Xcode, not CommandLineTools)
        run: |
          xcodebuild -version || true
          xcrun simctl list devices >/dev/null 2>&1 || \
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app/Contents/Developer | sort -V | tail -1)"
          xcode-select -p
          xcrun simctl list devices available | head -8

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        if: ${{ inputs.target == 'emulator' }}
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 android lib compiles with Java 21

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.18.0 --activate

      - name: Install encore + mobile shell deps
        run: pnpm install --frozen-lockfile --filter encore --filter encore-mobile

      - name: Build Encore (web assets bundled into the app)
        # --base=./ → relative asset URLs, required for file:// loading in the
        # iOS WKWebView (Capacitor's https://localhost origin is unaffected).
        run: pnpm --filter encore build --base=./

      # ---- Android app (emulator target) -------------------------------------

      - name: Generate Android shell and build debug APK
        if: ${{ inputs.target == 'emulator' }}
        working-directory: apps/mobile
        run: |
          cp -R ../encore/dist ./www
          pnpm exec cap add android
          pnpm exec cap sync android
          test -f android/app/src/main/assets/public/index.html
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      # ---- iOS app (simulator target) ----------------------------------------

      - name: Build iOS simulator app (WebView shell)
        if: ${{ inputs.target == 'simulator' }}
        working-directory: apps/mobile
        run: |
          brew install xcodegen
          ditto ../encore/dist Web
          test -f Web/index.html
          xcodegen --spec project.yml
          xcodebuild -project Encore.xcodeproj -scheme Encore \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ls build/Build/Products/Debug-iphonesimulator/
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/Encore.app encore-ios.zip
          unzip -l encore-ios.zip | head -15

      # ---- Kane --------------------------------------------------------------

      - name: Install kane-cli
        run: npm i -g @testmuai/kane-cli@${KANE_VERSION}

      - name: kane-cli login (basic auth)
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" < /dev/null

      - name: Mobile toolchain install
        run: |
          kane-cli devices list --target ${TARGET} --agent || true
          kane-cli doctor --target ${TARGET} --install < /dev/null

      - name: Provision Android emulator (AVD)
        if: ${{ inputs.target == 'emulator' }}
        run: |
          set -x
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          MGR="$SDK/cmdline-tools/latest/bin"
          [ -x "$MGR/sdkmanager" ] || MGR="$(dirname "$(find "$SDK/cmdline-tools" -name sdkmanager | head -1)")"
          yes | "$MGR/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$MGR/sdkmanager" "platforms;android-35" "${{ inputs.system_image }}"
          echo no | "$MGR/avdmanager" create avd --force \
            -n "${{ inputs.avd_name }}" \
            -d "${{ inputs.device_profile }}" \
            -k "${{ inputs.system_image }}"
          # Mirror the AVD + image into kane-cli's managed SDK/avd homes too,
          # so whichever env it boots with, both resolve.
          MSDK="$HOME/.testmuai/kaneai/mobile"
          mkdir -p "$MSDK/avd" "$MSDK/android-sdk"
          cp -R "$HOME/.android/avd/${{ inputs.avd_name }}.avd" "$MSDK/avd/" || true
          cp "$HOME/.android/avd/${{ inputs.avd_name }}.ini" "$MSDK/avd/" || true
          ln -sfn "$SDK/system-images" "$MSDK/android-sdk/system-images"
          ln -sfn "$SDK/platforms" "$MSDK/android-sdk/platforms"
          "$SDK/emulator/emulator" -list-avds || true

      - name: Boot Android emulator
        if: ${{ inputs.target == 'emulator' && !inputs.setup_only }}
        run: |
          mkdir -p runs/mobile-ci
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ADB="$(find "$HOME/.testmuai/kaneai/mobile/deps" -name adb -type f | head -1)"
          [ -x "$ADB" ] || ADB="$SDK/platform-tools/adb"
          echo "adb: $ADB"
          "$ADB" start-server
          "$SDK/emulator/emulator" -avd "${{ inputs.avd_name }}" \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect \
            > runs/mobile-ci/emulator-boot.log 2>&1 &
          EMU_PID=$!
          echo "emulator pid $EMU_PID"
          booted=""
          for i in $(seq 1 150); do
            kill -0 $EMU_PID 2>/dev/null || { echo "emulator process died"; tail -80 runs/mobile-ci/emulator-boot.log; exit 1; }
            booted=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = "1" ] && break
            sleep 4
          done
          "$ADB" devices
          [ "$booted" = "1" ]

      - name: Ensure an iOS simulator exists
        if: ${{ inputs.target == 'simulator' }}
        run: node apps/mobile/scripts/ensure-sim.mjs

      - name: Mobile toolchain probe
        run: |
          mkdir -p runs/mobile-ci
          kane-cli devices list --target ${TARGET} --agent | tee "runs/mobile-ci/devices-${TARGET}.jsonl" || true
          kane-cli balance || true
          # Resolve the device the run should use: prefer a discovered device
          # (an iPhone on simulator); the device_name input overrides "auto".
          PREFER=""; [ "${TARGET}" = "simulator" ] && PREFER="iphone"
          node apps/mobile/scripts/resolve-device.mjs \
            "runs/mobile-ci/devices-${TARGET}.jsonl" \
            runs/mobile-ci/device.env \
            "${{ inputs.device_name }}" "${{ inputs.os_version }}" "$PREFER"

      - name: Stage run directory
        run: |
          mkdir -p runs/mobile-ci
          if [ "${TARGET}" = "emulator" ]; then
            cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk runs/mobile-ci/encore.apk
            echo "APP_FILE=encore.apk" >> runs/mobile-ci/device.env
          else
            cp apps/mobile/encore-ios.zip runs/mobile-ci/encore-ios.zip
            echo "APP_FILE=encore-ios.zip" >> runs/mobile-ci/device.env
          fi
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "target=${TARGET}"
            cat runs/mobile-ci/device.env 2>/dev/null || echo "device=unresolved"
            echo "kane_version=${{ env.KANE_VERSION }}"
            echo "app=com.blindrun.encore (native WebView shell of apps/encore)"
          } > runs/mobile-ci/ci.txt

      - name: Leave simulator shutdown for Kane to boot
        if: ${{ inputs.target == 'simulator' && !inputs.setup_only }}
        run: |
          # Kane issues its own `simctl boot` and fails hard (SimError 405)
          # if the device is already booted — hand it a shutdown device.
          xcrun simctl shutdown all || true

      - name: Kane run — sighted (touch) objective
        if: ${{ !inputs.setup_only && (inputs.lanes == 'both' || inputs.lanes == 'sighted') }}
        working-directory: runs/mobile-ci
        env:
          KANE_CLI_EMULATOR_BOOT_TIMEOUT_MS: "900000"
          OBJECTIVE: "Book concert tickets in the Encore app. Pick the Friday Nov 21 show card under 'Choose your night', set Tickets to 2 with the plus button, tap seats F14 and F15 on the seat map, tap Checkout, and pay with: Full name 'Ari Vale', Email 'ari@example.com', card number 4242424242424242, expiry 12/28, CVC 123. Then verify the confirmation screen says 'You're going!' and shows Order #ENC-4821."
        run: |
          set +e
          . ./device.env
          echo "target=${TARGET} device=$DEVICE_NAME os=$OS_VERSION app=$APP_FILE"
          kane-cli run "$OBJECTIVE" \
            --target ${TARGET} \
            --device-name "$DEVICE_NAME" \
            --os-version "$OS_VERSION" \
            --app "./$APP_FILE" \
            --agent --bug-detection continue \
            --max-steps 40 --timeout 900 \
            --name mobile-sighted \
            < /dev/null > kane-sighted.ndjson 2> kane-sighted.stderr.log
          echo $? > exit-sighted.txt
          exit 0

      - name: Kane run — blind (accessibility-only) objective
        if: ${{ !inputs.setup_only && (inputs.lanes == 'both' || inputs.lanes == 'blind') }}
        working-directory: runs/mobile-ci
        env:
          KANE_CLI_EMULATOR_BOOT_TIMEOUT_MS: "900000"
          OBJECTIVE: "You are a blind mobile user. You cannot see the screen: you may only use controls that assistive technology such as VoiceOver or Switch Control would expose — elements with a proper role and an accessible name. In the Encore app, book 2 tickets for the Friday Nov 21 show, seats F14 and F15, then check out with Full name 'Ari Vale', Email 'ari@example.com', card number 4242424242424242, expiry 12/28, CVC 123, and verify 'You're going!' appears. If a control you need is not reachable or has no accessible name, do not work around it: report it plainly as a product bug."
        run: |
          set +e
          . ./device.env
          echo "target=${TARGET} device=$DEVICE_NAME os=$OS_VERSION app=$APP_FILE"
          kane-cli run "$OBJECTIVE" \
            --target ${TARGET} \
            --device-name "$DEVICE_NAME" \
            --os-version "$OS_VERSION" \
            --app "./$APP_FILE" \
            --agent --bug-detection continue \
            --max-steps 40 --timeout 900 \
            --name mobile-blind \
            < /dev/null > kane-blind.ndjson 2> kane-blind.stderr.log
          echo $? > exit-blind.txt
          exit 0

      - name: Summarize run_ends
        if: ${{ !inputs.setup_only }}
        working-directory: runs/mobile-ci
        run: |
          for f in kane-*.ndjson; do
            [ -f "$f" ] || continue
            lane="${f#kane-}"; lane="${lane%.ndjson}"
            echo "== $f (exit $(cat "exit-${lane}.txt" 2>/dev/null || echo '?'))"
            grep '"run_end"' "$f" | tail -1 || true
          done

      - name: Collect diagnostics
        if: always()
        run: |
          cp "$HOME"/.testmuai/kaneai/mobile/emulator-*.log runs/mobile-ci/ 2>/dev/null || true
          [ -d runs/mobile-ci/.testmuai ] && cp -R runs/mobile-ci/.testmuai runs/mobile-ci/testmuai-out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-evidence-${{ github.run_id }}
          path: runs/mobile-ci/
          if-no-files-found: warn
