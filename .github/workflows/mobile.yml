name: Mobile — Kane CLI on Android emulator

# Runs Encore (the demo booking app) inside a Capacitor WebView-shell .apk on a
# real Android emulator, on a macOS Apple-Silicon runner — the only GitHub-hosted
# runner kane-cli supports for --target emulator/simulator. The same planted
# accessibility barriers ship in the APK, so a "blind" (accessibility-only)
# objective exercises them exactly like a TalkBack/Switch Access user would.

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: Which Kane objectives to run
        required: true
        default: both
        type: choice
        options: [both, sighted, blind]
      device_name:
        description: Emulator device name as `kane-cli devices list` shows it
        required: true
        default: Pixel 8 Pro
      os_version:
        description: Emulator Android version
        required: true
        default: "15"
      setup_only:
        description: Stop after doctor/devices probe — no Kane runs (0 credits)
        required: false
        type: boolean
        default: false

concurrency:
  group: mobile-ci
  cancel-in-progress: false

env:
  KANE_VERSION: "0.10.6"
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  mobile:
    runs-on: macos-15 # arm64 Apple Silicon — required for --target emulator
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 android lib compiles with Java 21

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.18.0 --activate

      - name: Install encore + mobile shell deps
        run: pnpm install --frozen-lockfile --filter encore --filter encore-mobile

      - name: Build Encore (web assets bundled into the APK)
        run: pnpm --filter encore build

      - name: Generate Android shell and build debug APK
        working-directory: apps/mobile
        run: |
          cp -R ../encore/dist ./www
          pnpm exec cap add android
          pnpm exec cap sync android
          test -f android/app/src/main/assets/public/index.html
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: Install kane-cli
        run: npm i -g @testmuai/kane-cli@${KANE_VERSION}

      - name: kane-cli login (basic auth)
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY" < /dev/null

      - name: Mobile toolchain probe
        run: |
          set -x
          kane-cli devices list --target emulator --agent || true
          kane-cli doctor --target emulator --install < /dev/null
          kane-cli devices list --target emulator --agent || true
          kane-cli balance || true

      - name: Stage run directory
        run: |
          mkdir -p runs/mobile-ci
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk runs/mobile-ci/encore.apk
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "device_name=${{ inputs.device_name }}"
            echo "os_version=${{ inputs.os_version }}"
            echo "kane_version=${{ env.KANE_VERSION }}"
            echo "app=com.blindrun.encore (Capacitor WebView shell of apps/encore)"
          } > runs/mobile-ci/ci.txt

      - name: Kane run — sighted (touch) objective
        if: ${{ !inputs.setup_only && (inputs.lanes == 'both' || inputs.lanes == 'sighted') }}
        working-directory: runs/mobile-ci
        env:
          OBJECTIVE: "Book concert tickets in the Encore app. Pick the Friday Nov 21 show card under 'Choose your night', set Tickets to 2 with the plus button, tap seats F14 and F15 on the seat map, tap Checkout, and pay with: Full name 'Ari Vale', Email 'ari@example.com', card number 4242424242424242, expiry 12/28, CVC 123. Then verify the confirmation screen says 'You're going!' and shows Order #ENC-4821."
        run: |
          set +e
          kane-cli run "$OBJECTIVE" \
            --target emulator \
            --device-name "${{ inputs.device_name }}" \
            --os-version "${{ inputs.os_version }}" \
            --app ./encore.apk \
            --agent --bug-detection continue \
            --max-steps 40 --timeout 900 \
            --name mobile-sighted \
            < /dev/null > kane-sighted.ndjson 2> kane-sighted.stderr.log
          echo $? > exit-sighted.txt
          exit 0

      - name: Kane run — blind (accessibility-only) objective
        if: ${{ !inputs.setup_only && (inputs.lanes == 'both' || inputs.lanes == 'blind') }}
        working-directory: runs/mobile-ci
        env:
          OBJECTIVE: "You are a blind Android user. You cannot see the screen: you may only use controls that Android accessibility services such as TalkBack or Switch Access expose to you — elements with a proper role and an accessible name. In the Encore app, book 2 tickets for the Friday Nov 21 show, seats F14 and F15, then check out with Full name 'Ari Vale', Email 'ari@example.com', card number 4242424242424242, expiry 12/28, CVC 123, and verify 'You're going!' appears. If a control you need is not reachable or has no accessible name, do not work around it: report it plainly as a product bug."
        run: |
          set +e
          kane-cli run "$OBJECTIVE" \
            --target emulator \
            --device-name "${{ inputs.device_name }}" \
            --os-version "${{ inputs.os_version }}" \
            --app ./encore.apk \
            --agent --bug-detection continue \
            --max-steps 40 --timeout 900 \
            --name mobile-blind \
            < /dev/null > kane-blind.ndjson 2> kane-blind.stderr.log
          echo $? > exit-blind.txt
          exit 0

      - name: Summarize run_ends
        if: ${{ !inputs.setup_only }}
        working-directory: runs/mobile-ci
        run: |
          for f in kane-*.ndjson; do
            [ -f "$f" ] || continue
            lane="${f#kane-}"; lane="${lane%.ndjson}"
            echo "== $f (exit $(cat "exit-${lane}.txt" 2>/dev/null || echo '?'))"
            grep '"run_end"' "$f" | tail -1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-evidence-${{ github.run_id }}
          path: runs/mobile-ci/
          if-no-files-found: warn
